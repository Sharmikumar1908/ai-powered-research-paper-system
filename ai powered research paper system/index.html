<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Research Paper Recommendation</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>📚 AI Research Paper Discovery</h1>

        <p class="subtitle">
            Find research papers based on your topic
        </p>

        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="Enter topic e.g. Artificial Intelligence"
            >

            <button onclick="searchPapers()">
                Search
            </button>
        </div>

        <div id="results"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
